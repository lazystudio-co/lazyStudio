name: CI/CD Deploy

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

    steps:
      - name: 📥 Clone repo
        uses: actions/checkout@v4

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install deps
        run: npm ci

      - name: 🧪 Run tests (optional)
        run: npm run test --if-present

      - name: 🏗️ Build
        run: npm run build

      # SSH setup
      - name: 🔑 Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: 🧾 Trust server host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SERVER_PORT }} -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: 🚀 Deploy to Server
        run: |
          ssh -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            set -e
            APP_DIR="${{ secrets.SERVER_APP_DIR }}"
            cd "$APP_DIR"

            echo "Current server commit: $(git rev-parse --short HEAD)"
            git fetch origin main
            git reset --hard origin/main
            echo "Updated server commit: $(git rev-parse --short HEAD)"

            npm ci
            npm run build

            pm2 delete lazystudio >/dev/null 2>&1 || true
            pm2 start npm --name "lazystudio" --cwd "$APP_DIR" -- start
            pm2 save
          EOF
