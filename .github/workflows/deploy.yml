name: CI/CD Deploy

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

    steps:
      - name: 📥 Clone repo
        uses: actions/checkout@v4

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install deps
        run: npm install

      - name: 🧪 Run tests (optional)
        run: npm run test --if-present

      - name: 🏗️ Build
        run: npm run build

      - name: 🧹 Prune dev dependencies
        run: npm prune --omit=dev

      - name: 📦 Package release
        run: |
          # Ship the build output and production dependencies so the server never
          # rebuilds or installs packages during deploy.
          tar -czf release.tar.gz \
            .next \
            node_modules \
            public \
            package.json \
            package-lock.json \
            next.config.mjs

      - name: ⬆️ Upload release archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "release.tar.gz"
          target: "/tmp"

      - name: 🚀 Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            APP_DIR="${{ secrets.SERVER_APP_DIR }}"
            APP_PORT="${{ secrets.SERVER_APP_PORT }}"
            APP_PORT="${APP_PORT:-3002}"
            mkdir -p "$APP_DIR"
            rm -rf "$APP_DIR/.next" "$APP_DIR/node_modules"
            tar -xzf /tmp/release.tar.gz -C "$APP_DIR"

            cd "$APP_DIR"

            pm2 delete lazystudio >/dev/null 2>&1 || true
            NODE_ENV=production PORT="$APP_PORT" pm2 start npm --name "lazystudio" --cwd "$APP_DIR" --update-env -- start -- -p "$APP_PORT"
            pm2 save

            # Quick runtime validation to catch 502 root causes during deploy.
            pm2 status lazystudio
            sleep 3

            if ! pm2 describe lazystudio | grep -q "status.*online"; then
              echo "PM2 process is not online. Recent logs:"
              pm2 logs lazystudio --lines 100 --nostream || true
              exit 1
            fi

            if ! curl -fsS "http://127.0.0.1:${APP_PORT}" >/dev/null; then
              echo "App is not responding on port ${APP_PORT}. Recent logs:"
              pm2 logs lazystudio --lines 100 --nostream || true
              exit 1
            fi

            rm -f /tmp/release.tar.gz
